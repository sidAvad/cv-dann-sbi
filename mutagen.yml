sync:
  cv-dann-sbi-adamant:
    alpha: "."
    beta: "sa4604@adamant:~/cv-dann-sbi"
    mode: "two-way-resolved"
    ignore:
      paths:
        - ".git"
        - ".venv"
        - "__pycache__"
        - "*.pyc"
        - "outputs/"
        - "dry-runs/"
